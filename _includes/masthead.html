
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item">
            <a href="{% if page.lang == 'en' %}{{ '/eng/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}" target="_self">
              Homepage
            </a>
          </li>
          {% assign navigation = site.data.navigation.main %}
          {% if page.lang == 'en' %}{% assign navigation = site.data.navigation.main_en %}{% endif %}
          {% for link in navigation %}
            <li class="masthead__menu-item"><a href="{{ link.url | relative_url }}" target="_self">{{ link.title }}</a></li>
          {% endfor %}
          <li class="masthead__menu-item">{% if page.lang == 'en' %}<a href="{{ '/' | relative_url }}" target="_self" lang="zh-CN">中文</a>{% else %}<a href="{{ '/eng/' | relative_url }}" target="_self" lang="en">English</a>{% endif %}</li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
